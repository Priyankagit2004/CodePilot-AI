[project]
name = "codepilot-api"
version = "0.1.0"
description = "CodePilot AI API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "python-dotenv>=1.0,<2.0",
  "python-multipart>=0.0.18,<1.0",
  "chromadb>=1.0,<2.0",
  "google-genai>=1.0,<2.0",
  "langchain-chroma>=0.2,<1.0",
  "langchain-core>=0.3,<1.0",
  "langchain-huggingface>=0.1,<1.0",
  "langchain-text-splitters>=0.3,<1.0",
  "langgraph>=0.3,<1.0",
  "sentence-transformers>=3.0,<4.0",
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-java>=0.23,<0.25",
  "tree-sitter-javascript>=0.23,<0.25",
  "tree-sitter-python>=0.23,<0.25",
  "tree-sitter-typescript>=0.23,<0.25",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.8,<1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
