services:
  api:
    build:
      context: ./apps/api
    env_file:
      - ./apps/api/.env
    ports:
      - "8000:8000"
    volumes:
      - repository-data:/data/repositories
      - chroma-data:/data/chroma
    environment:
      REPOSITORY_STORAGE_DIR: /data/repositories
      CHROMA_STORAGE_DIR: /data/chroma
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  repository-data:
  chroma-data:
